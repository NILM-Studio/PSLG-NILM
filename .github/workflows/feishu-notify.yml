name: Feishu Notifier

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          set -euo pipefail

          WEBHOOK="${FEISHU_WEBHOOK:-}"
          WEBHOOK=$(printf '%s' "$WEBHOOK" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')

          if [ -z "$WEBHOOK" ]; then
            echo "::error::Missing GitHub Actions secret FEISHU_WEBHOOK_URL. Add the Feishu bot webhook URL in repo Settings > Secrets and variables > Actions."
            exit 1
          fi

          COUNT=$(printf '%s' "$COMMITS_JSON" | jq 'length')

          LIST=""
          if [ "$COUNT" -eq 0 ]; then
            LIST="_No commit details are available for this push._"
          else
            for i in $(seq 0 $((COUNT-1))); do
              MSG=$(printf '%s' "$COMMITS_JSON" | jq -r ".[$i].message | split(\"\n\")[0]")
              SHA=$(printf '%s' "$COMMITS_JSON" | jq -r ".[$i].id" | cut -c1-7)
              URL=$(printf '%s' "$COMMITS_JSON" | jq -r ".[$i].url")

              ITEM="• [$SHA]($URL): $MSG"
              if [ -z "$LIST" ]; then
                LIST="$ITEM"
              else
                LIST="$LIST<br>$ITEM"
              fi
            done
          fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg actor "$ACTOR" \
            --arg ref "$REF_NAME" \
            --arg count "$COUNT" \
            --arg list "$LIST" \
            '{
              msg_type: "interactive",
              card: {
                config: { wide_screen_mode: true },
                header: {
                  title: { tag: "plain_text", content: ("📦 " + $repo) },
                  template: "blue"
                },
                elements: [
                  { tag: "div", text: { tag: "lark_md", content: ("**" + $actor + "** pushed **" + $count + " commit(s)** to **" + $ref + "** branch") } },
                  { tag: "div", text: { tag: "lark_md", content: $list } }
                ]
              }
            }')

          echo "Sending Feishu notification..."
          RESPONSE=$(curl --fail-with-body -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Feishu response: $RESPONSE"
          if ! printf '%s' "$RESPONSE" | jq -e '(.StatusCode? == 0) or (.code? == 0)' >/dev/null; then
            echo "::error::Feishu webhook returned a non-success response."
            exit 1
          fi