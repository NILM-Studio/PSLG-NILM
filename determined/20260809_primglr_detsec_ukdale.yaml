# Determined AI task config — UK-DALE building1 washing machine, FULL pipeline: extract+segment (prim-glr) + feature (detsec) + cluster (kmeans).
# All datasets are resampled to the UK-DALE 6s grid (fs=0.1666667) before activity-state extraction.
# detsec runs on 4090 pool with batch_size=8 (config_ukdale_detsec.yaml: memory cliff).
# run_id=20260809_primglr_detsec_ukdale -> artifacts under log_det_test/20260809_primglr_detsec_ukdale/.
# Push:   det command run --config-file determined/20260809_primglr_detsec_ukdale.yaml --detach
description: 20260809_primglr_detsec_ukdale
entrypoint:
  - bash
  - /labdata2/lexingruan/pslg-nilm/determined/run_test.sh
  - prim-glr                                       # SEGMENT_METHOD
  - detsec                                         # FEATURE_MODEL
  - kmeans                                         # CLUSTER_METHOD
  - "2,3,4,5,6,7,8"                                # N_CLUSTERS
  - 20260809_primglr_detsec_ukdale                 # RUN_ID
  - /labdata2/lexingruan/pslg-nilm/input/ukdale_washing_machine_full.csv   # RAW_SERIES
  - config/config_ukdale_detsec.yaml               # CONFIG (threshold=10W, resample_fs=0.1666667, batch_size=8)

environment:
  image: harbor.lins.lab/determinedai/environments:cuda-11.8-pytorch-2.0-gpu-mpi-0.31.1

resources:
  slots: 1
  shm_size: 4000000000
  resource_pool: 64c128t_512_4090

bind_mounts:
  - host_path: /labdata2
    container_path: /labdata2
    read_only: false
