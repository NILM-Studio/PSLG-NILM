# Determined AI task config — REFIT building1 washing_machine, extract+segment (clasp-origin), task renamed to reflect the model.
# run_id=20260808_clasp-origin_refit -> artifacts under log_det_test/20260808_clasp-origin_refit/ + output/20260808_clasp-origin_refit/.
# Push:   det command run --config-file determined/20260808_clasp-origin_refit.yaml --detach
description: 20260808_clasp-origin_refit
entrypoint:
  - bash
  - /labdata2/lexingruan/pslg-nilm/determined/run_dataset_segment.sh
  - 20260808_clasp-origin_refit                             # RUN_ID
  - /labdata2/lexingruan/pslg-nilm/input/refit_washing_machine.csv   # RAW_SERIES
  - washing_machine                                 # APPLIANCE
  - config/config_refit.yaml                        # CONFIG (threshold=5W, fs=0.1428571)

environment:
  image: harbor.lins.lab/determinedai/environments:cuda-11.8-pytorch-2.0-gpu-mpi-0.31.1

resources:
  slots: 1
  shm_size: 4000000000
  resource_pool: 64c128t_512_4090

bind_mounts:
  - host_path: /labdata2
    container_path: /labdata2
    read_only: false
