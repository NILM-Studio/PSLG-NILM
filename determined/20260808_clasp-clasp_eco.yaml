# Determined AI task config — ECO building1 washing_machine, extract+segment (clasp = BinaryClaSP + wavelet) for comparison vs clasp-origin.
# run_id=20260808_clasp-clasp_eco -> artifacts under log_det_test/20260808_clasp-clasp_eco/ + output/20260808_clasp-clasp_eco/.
# Push:   det command run --config-file determined/20260808_clasp-clasp_eco.yaml --detach
description: 20260808_clasp-clasp_eco
entrypoint:
  - bash
  - /labdata2/lexingruan/pslg-nilm/determined/run_dataset_segment.sh
  - 20260808_clasp-clasp_eco                               # RUN_ID
  - /labdata2/lexingruan/pslg-nilm/input/eco_washing_machine.csv   # RAW_SERIES
  - washing_machine                                 # APPLIANCE
  - config/config_eco.yaml                          # CONFIG (threshold=20W, fs=1.0)
  - clasp

environment:
  image: harbor.lins.lab/determinedai/environments:cuda-11.8-pytorch-2.0-gpu-mpi-0.31.1

resources:
  slots: 1
  shm_size: 4000000000
  resource_pool: 64c128t_512_4090

bind_mounts:
  - host_path: /labdata2
    container_path: /labdata2
    read_only: false
