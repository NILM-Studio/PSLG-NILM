# Determined AI task config — REDD building1 washer_dryer (washing machine), extract+segment (prim-glr).
# All datasets are resampled to the UK-DALE 6s grid (fs=0.1666667) before activity-state extraction.
# run_id=20260809_055315_prim-glr_redd -> artifacts under log_det_test/20260809_055315_prim-glr_redd/ + output/20260809_055315_prim-glr_redd/.
# Push:   det command run --config-file determined/20260809_055315_prim-glr_redd.yaml --detach
description: 20260809_055315_prim-glr_redd
entrypoint:
  - bash
  - /labdata2/lexingruan/pslg-nilm/determined/run_dataset_segment.sh
  - 20260809_055315_prim-glr_redd                             # RUN_ID
  - /labdata2/lexingruan/pslg-nilm/input/redd_washing_machine.csv   # RAW_SERIES
  - washing_machine                                 # APPLIANCE
  - config/config_redd.yaml                         # CONFIG (threshold=5W, resample_fs=0.1666667)
  - prim-glr

environment:
  image: harbor.lins.lab/determinedai/environments:cuda-11.8-pytorch-2.0-gpu-mpi-0.31.1

resources:
  slots: 1
  shm_size: 4000000000
  resource_pool: 64c128t_512_4090

bind_mounts:
  - host_path: /labdata2
    container_path: /labdata2
    read_only: false
