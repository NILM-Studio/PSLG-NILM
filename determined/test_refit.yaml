# Determined AI task config — REFIT building1 washing_machine, extract+segment (clasp-origin).
# run_id=test_refit -> artifacts under log_det_test/test_refit/ (persisted best-effort).
# Push:   det task create determined/test_refit.yaml
entrypoint:
  - bash
  - /labdata2/lexingruan/pslg-nilm/determined/run_dataset_segment.sh
  - test_refit                                      # RUN_ID
  - /labdata2/lexingruan/pslg-nilm/input/refit_washing_machine.csv   # RAW_SERIES
  - washing_machine                                 # APPLIANCE

environment:
  image: harbor.lins.lab/determinedai/environments:cuda-11.8-pytorch-2.0-gpu-mpi-0.31.1

resources:
  slots: 1
  shm_size: 4000000000
  resource_pool: 64c128t_512_4090

bind_mounts:
  - host_path: /labdata2
    container_path: /labdata2
    read_only: false
