# R2 fairness: kmeans(n_init=30) on the S3 detsec_pc features (run 20260810_120812_pcdetsec_s3_refit).
# No training. CPU-light. Adds kmeans_k2..k8 tags to the same run manifest.
description: 20260810_123156_s3_kmeans_refit
entrypoint:
  - bash
  - /labdata2/lexingruan/pslg-nilm/determined/run_cluster_reuse.sh
  - 20260810_120812_pcdetsec_s3_refit                                     # RUN_ID (reuse features)
  - kmeans                                        # CLUSTER_METHOD
  - config/config_refit_pcdetsec_s3.yaml          # CONFIG
  - "2,3,4,5,6,7,8"                               # N_CLUSTERS

environment:
  image: harbor.lins.lab/determinedai/environments:cuda-11.8-pytorch-2.0-gpu-mpi-0.31.1

resources:
  slots: 1
  shm_size: 4000000000
  resource_pool: 64c128t_512_4090

bind_mounts:
  - host_path: /labdata2
    container_path: /labdata2
    read_only: false
