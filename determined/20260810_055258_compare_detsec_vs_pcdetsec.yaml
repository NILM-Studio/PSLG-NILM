# Determined AI task config — controlled comparison: detsec(kmeans) vs
# detsec_pc(dpc-kmeans) clustering quality, disentangling the feature-
# extraction factor from the clustering-algorithm factor.
# CPU-only, few threads. Output: output/20260810_055258_compare_detsec_vs_pcdetsec/compare_summary.json.
# Push: det command run --config-file determined/20260810_055258_compare_detsec_vs_pcdetsec.yaml --detach
description: 20260810_055258_compare_detsec_vs_pcdetsec
entrypoint:
  - bash
  - /labdata2/lexingruan/pslg-nilm/determined/run_compare_feats.sh
  - 20260810_055258_compare_detsec_vs_pcdetsec                                     # OUT_TAG

environment:
  image: harbor.lins.lab/determinedai/environments:cuda-11.8-pytorch-2.0-gpu-mpi-0.31.1

resources:
  slots: 1
  shm_size: 4000000000
  resource_pool: 64c128t_512_4090

bind_mounts:
  - host_path: /labdata2
    container_path: /labdata2
    read_only: false
