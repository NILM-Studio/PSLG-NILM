run:
  appliance: washing_machine
paths:
  raw_series: input/ukdale_washing_machine_full.csv
  cache_dir: .cache
extract_active_data:
  method: simple
  threshold: 10
  t_drop: 150
  t_min_work: 180
  context_seconds: 90
  fs: 0.1666667
  resample_fs: 0.1666667
time_segmentation:
  window_size: 30
  n_regimes: 2
  excl_factor: 4
  clasp_n_jobs: -1
  clasp_n_segments: learn
  max_seg_len: 1536
feature_extract:
  latent_dim: 16
  epochs: 50
  batch_size: 8
  learning_rate: 0.0001
  patience: 5
  attention_size: 32
  cache: true
time_clustering:
  normalization_method: zscore
  col_index: 2
  metric: euclidean
  method_specific:
    kmeans:
      n_init: 30
      max_iter: 300
      random_state: 42
    dbscan:
      eps: 1.25
      min_pts: 20
    hdbscan:
      min_cluster_size: 20
      min_samples: 10
      cluster_selection_method: eom
      cluster_selection_epsilon: 0.0
few_shot_cluster_extract:
  n_percent: 50
  adj_threshold: 0.6
  center_margin: 0.1
  center_support_threshold: 0.6
  export_format: csv
temporal_state_merge:
  merge_mode: same_label_plus_similar
  enable_similar_merge: true
  similar_feature_tol: 2.0
  min_block_seconds: 90
  fs: 0.1666667
cycle_classification:
  min_support: 3
  max_classes: 12
  rare_max_distance: 0.34
  min_pattern_blocks: 3
  min_unique_states: 2
cycle_validation:
  min_class_support: 30
  min_signature_purity: 0.5
  min_valid_member_ratio: 0.7
  core_state_min_prevalence: 0.8
  terminal_state_min_prevalence: 0.7
  min_duration_seconds: 300
  boundary_window_seconds: 60
  boundary_absolute_watts: 50
  boundary_peak_ratio: 0.15
  max_missing_ratio: 0.01
  robust_z_threshold: 3.5
  max_metric_modes: 3
  min_mode_support: 10
  mode_bic_min_gain: 10
  mode_random_state: 42
  class_overrides: {}
  fs: 0.1666667
cycle_split:
  train_ratio: 0.7
  validation_ratio: 0.1
  test_ratio: 0.2
primitive_synthesis:
  n_cycles: 100
  random_seed: 42
  min_blocks: 3
  max_blocks: 20
  class_sampling: balanced
  mode_sampling: empirical
  candidate_pool: 32
  within_state_smooth_samples: 3
  boundary_smooth_samples: 3
  require_cycle_validation: true
  require_cycle_split: true
  fs: 0.1666667
synthesis_evaluation:
  waveform_points: 256
  fs: 0.1666667
dataset_split:
  mains_series: input/fridge_mains.npy
  few_train_ratio: 0.5
  non_few_train_ratio: 0.8
  random_seed: 42
  timestamp_tolerance_seconds: 0.0
  clip_negative_mains_to_zero: true
visualization:
  language: en
  visualize_noise: true
  cluster_stack_count: 50
  max_per_chart: 20
