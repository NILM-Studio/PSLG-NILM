run:
  appliance: washing_machine
  segment_method: prim-glr
  feature_model: detsec_pc
  cluster_method: kmeans
  n_clusters:
  - 5
  cluster_tag: kmeans_k5_merged
paths:
  raw_series: ''
  cache_dir: .cache
extract_active_data:
  method: simple
  threshold: 20
  t_drop: 150
  t_min_work: 180
  context_seconds: 90
  fs: 0.1666667
  resample_fs: 0.1666667
time_segmentation:
  window_size: 30
  n_regimes: 2
  excl_factor: 4
  clasp_n_jobs: -1
  clasp_n_segments: learn
  max_seg_len: 1536
feature_extract:
  latent_dim: 16
  embed_dim: 32
  lambda_phy: 0.1
  nonneg_channels:
  - 0
  - 1
  - 2
  - 3
  norm_mode: minmax
  embed_proj: relu
  tf_ratio: 0.0
  tf_schedule: linear
  epochs: 50
  batch_size: 8
  learning_rate: 0.0001
  patience: 10
  attention_size: 32
  cache: false
time_clustering:
  normalization_method: zscore
  col_index: 2
  metric: euclidean
  method_specific:
    kmeans:
      n_init: 30
      max_iter: 300
      random_state: 42
    dpc_kmeans:
      percent: 2.0
      min_dist_tau: null
      random_state: 0
      k_nn: 5
    dbscan:
      eps: 1.25
      min_pts: 20
    hdbscan:
      min_cluster_size: 20
      min_samples: 10
      cluster_selection_method: eom
      cluster_selection_epsilon: 0.0
temporal_state_merge:
  merge_mode: same_label_plus_similar
  enable_similar_merge: true
  similar_feature_tol: 2.0
  min_block_seconds: 90
  fs: 0.1666667
visualization:
  language: en
  visualize_noise: true
  cluster_stack_count: 50
  max_per_chart: 20
workflow:
  profile: nilm
data_protocol:
  manifest: ../nilm_experiments/sequence_workflow_20260915/manifest.json
  sample_seconds: 6
runtime:
  torch_python: /home/scnu202438025446/miniconda3/envs/nilmformer-cu118-v1/bin/python
  require_slurm: true
nilm:
  k: 5
  window_length: 600
  train_stride: 300
  eval_stride: 300
  sample_seconds: 6
  threshold: 20
  models:
  - NILMFormer
  - FCN
  seeds:
  - 0
  cases:
  - name: R
    arm: R
    activity_head: none
    weights:
    - - 0.0
      - 0.0
  - name: O
    arm: O
    activity_head: none
    weights:
    - - 0.01
      - 0.0
  - name: B
    arm: B
    activity_head: none
    weights:
    - - 0.01
      - 0.0
  - name: BP
    arm: BP
    activity_head: none
    weights:
    - - 0.01
      - 0.0
  - name: P
    arm: P
    activity_head: none
    weights:
    - - 0.01
      - 0.0
  - name: P_direct
    arm: P
    activity_head: direct
    weights:
    - - 0.01
      - 0.01
  - name: P_gru
    arm: P
    activity_head: gru
    weights:
    - - 0.01
      - 0.01
  - name: BP_gru
    arm: BP
    activity_head: gru
    weights:
    - - 0.01
      - 0.01
  - name: O_gru
    arm: O
    activity_head: gru
    weights:
    - - 0.01
      - 0.01
  sequence_head:
    hidden_size: 32
  training:
    device: cuda
    epochs: 3
    patience: 3
    batch_size: 32
    lr: 0.0001
    loss: mse
    gradient_clip: 1.0
    lr_patience: 3
  purpose: Source-only engineering pilot. Not the frozen multi-seed efficacy experiment.
